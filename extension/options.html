<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Personale — Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 480px; margin: 32px auto; color: #e0e0e0; background: #1a1a2e; }
    h1 { font-size: 18px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #999; }
    input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #333; border-radius: 6px; background: #16213e; color: #e0e0e0; font-size: 13px; font-family: monospace; box-sizing: border-box; }
    textarea { height: 100px; resize: vertical; }
    .field { margin-bottom: 16px; }
    .toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    button { padding: 8px 16px; background: #7C5CFC; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { opacity: 0.9; }
    .status { margin-top: 12px; font-size: 12px; color: #4caf50; }
  </style>
</head>
<body>
  <h1>Personale Browser Tracker</h1>

  <div class="toggle">
    <input type="checkbox" id="enabled" checked>
    <label for="enabled" style="display:inline; margin:0;">Enable tracking</label>
  </div>

  <div class="field">
    <label>Server URL</label>
    <input type="text" id="serverURL" value="http://localhost:8696">
  </div>

  <div class="field">
    <label>Excluded domains (one per line)</label>
    <textarea id="excludedDomains"></textarea>
  </div>

  <button id="save">Save</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
