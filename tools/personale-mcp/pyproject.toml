[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personale-mcp"
version = "0.1.0"
description = "Read-only MCP server for the local Personale activity tracker."
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
personale-mcp = "personale_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["personale_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
