<!-- @dsCard group="Colors" viewport="700x110" name="Chart Palette" subtitle="9-color data visualization palette" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-background); font-family: var(--font-sans); display: flex; align-items: center; padding: 16px 20px; gap: 8px; box-sizing: border-box; height: 78px; }
  .chip { flex: 1; height: 46px; border-radius: 6px; display: flex; flex-direction: column; justify-content: flex-end; padding: 5px 7px; gap: 1px; }
  .name { font-size: 8px; font-weight: 600; letter-spacing: 0.3px; }
  .hex { font-size: 8px; font-family: var(--font-mono); opacity: 0.75; }
</style></head>
<body>
  <div class="chip" style="background:#7c5cfc;">
    <span class="name" style="color:#fff">Purple</span>
    <span class="hex" style="color:#fff">#7C5CFC</span>
  </div>
  <div class="chip" style="background:#9b85f5;">
    <span class="name" style="color:#101014">Purple Lt</span>
    <span class="hex" style="color:#101014">#9B85F5</span>
  </div>
  <div class="chip" style="background:#00ccbf;">
    <span class="name" style="color:#101014">Cyan</span>
    <span class="hex" style="color:#101014">#00CCBF</span>
  </div>
  <div class="chip" style="background:#35a882;">
    <span class="name" style="color:#fff">Teal</span>
    <span class="hex" style="color:#fff">#35A882</span>
  </div>
  <div class="chip" style="background:#d64d8a;">
    <span class="name" style="color:#fff">Pink</span>
    <span class="hex" style="color:#fff">#D64D8A</span>
  </div>
  <div class="chip" style="background:#f5a623;">
    <span class="name" style="color:#101014">Amber</span>
    <span class="hex" style="color:#101014">#F5A623</span>
  </div>
  <div class="chip" style="background:#3b82f6;">
    <span class="name" style="color:#fff">Blue</span>
    <span class="hex" style="color:#fff">#3B82F6</span>
  </div>
  <div class="chip" style="background:#3d4451;">
    <span class="name" style="color:#e0e0e0">Gray</span>
    <span class="hex" style="color:#e0e0e0">#3D4451</span>
  </div>
  <div class="chip" style="background:#6b7280;">
    <span class="name" style="color:#101014">Gray Lt</span>
    <span class="hex" style="color:#101014">#6B7280</span>
  </div>
</body></html>
